<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – صفحة البائع</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}
.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:500px;width:100%;background:#0b1220;border-radius:16px;padding:32px 26px;text-align:right;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
h1{font-size:28px;margin-bottom:12px;text-align:center;}
h1 span{color:#22c55e;}
label{display:block;margin-top:12px;font-weight:bold;}
input,select{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
button{width:100%;margin-top:20px;padding:12px;background:#22c55e;color:#022c22;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
button:hover{background:#16a34a;}
#sendZone{display:none;margin-top:20px;text-align:center;}
.client-score{margin-bottom:10px;font-size:14px;}
.logo{display:block;margin:0 auto 15px;width:150px;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <img src="logo.png" class="logo" alt="Confirmi">
    <h1>Confirmi <span>✓</span></h1>

    <div class="client-score">⭐ تقييم الزبون: <span id="clientScore">0</span></div>

    <form id="vendorForm" enctype="multipart/form-data">
      <label>اسم الزبون
        <input type="text" id="clientName" required>
      </label>
      <label>رقم الهاتف
        <input type="tel" id="clientPhone" required>
      </label>

      <label>رمز المنتج
        <input type="text" id="productRef" required>
      </label>
      <label>صورة المنتج
        <input type="file" id="productPhoto" accept="image/*">
      </label>
      <label>السعر
        <input type="number" id="amount" required>
      </label>
      <label>الوصف
        <input type="text" id="description">
      </label>
      <button type="button" id="createBtn">إنشاء تأكيد الطلب</button>
    </form>

    <div id="sendZone">
      <p><strong>✅ تم إنشاء التأكيد</strong></p>
      <label>رابط إرسال للزبون
        <input type="text" id="clientLink" readonly style="font-size:13px;">
      </label>
      <button type="button" id="copyBtn">نسخ الرابط</button>
      <button type="button" onclick="sendWhatsApp()">فتح WhatsApp</button>
      <button type="button" onclick="sendSMS()">فتح SMS</button>
    </div>

  </div>
</div>

<script>
const createBtn = document.getElementById("createBtn");
const sendZone = document.getElementById("sendZone");
const clientLinkInput = document.getElementById("clientLink");
const clientScoreSpan = document.getElementById("clientScore");
let confirmationLink = "";
let transactionCreated = false;

// --- Fonction affichage score client par téléphone ---
document.getElementById("clientPhone").addEventListener("blur", async ()=>{
  const phone = document.getElementById("clientPhone").value.trim();
  if(!phone){ clientScoreSpan.innerText = "0"; return; }

  try{
    const res = await fetch(`/score/client/${phone}`);
    const data = await res.json();
    if(data.success){
      clientScoreSpan.innerText = `${data.score} ⭐ (${data.badge})`;
    } else {
      clientScoreSpan.innerText = "0";
    }
  }catch(e){
    console.error(e);
    clientScoreSpan.innerText = "0";
  }
});

// --- Création confirmation ---
createBtn.addEventListener("click", async () => {
  if(transactionCreated){ alert("تم إنشاء الطلب مسبقًا"); return; }

  const clientName = document.getElementById("clientName").value.trim();
  const clientPhone = document.getElementById("clientPhone").value.trim();
  const productRef = document.getElementById("productRef").value.trim();
  const amount = document.getElementById("amount").value.trim();
  const description = document.getElementById("description").value.trim();
  const productPhoto = document.getElementById("productPhoto").files[0];

  if(!clientName||!clientPhone||!productRef||!amount){ alert("الرجاء ملء جميع الحقول"); return; }
  if(!/^\d{10}$/.test(clientPhone)){ alert("رقم الهاتف غير صحيح"); return; }

  const formData = new FormData();
  formData.append("clientName", clientName);
  formData.append("clientPhone", clientPhone);
  formData.append("productRef", productRef);
  formData.append("amount", amount);
  formData.append("description", description);
  if(productPhoto) formData.append("productPhoto", productPhoto);

  try{
    const res = await fetch("/create-confirmation",{ method:"POST", body:formData });
    const data = await res.json();
    if(!data.success){ alert(data.message); return; }

    confirmationLink = data.clientLink;
    clientLinkInput.value = confirmationLink;
    sendZone.style.display="block";
    transactionCreated=true;
  }catch(err){ console.error(err); alert("خطأ فى إرسال الطلب"); }
});

// --- Copier le lien avec fallback ---
document.getElementById("copyBtn").addEventListener("click", ()=>{
  clientLinkInput.select();
  clientLinkInput.setSelectionRange(0,99999);
  document.execCommand("copy");
  alert("تم نسخ الرابط");
});

// --- WhatsApp / SMS ---
function sendWhatsApp(){ window.open("https://wa.me/?text="+encodeURIComponent("تأكيد طلبك عبر الرابط: "+confirmationLink),"_blank"); }
function sendSMS(){ window.location.href="sms:?body="+encodeURIComponent("تأكيد طلبك عبر الرابط: "+confirmationLink); }
</script>

</body>
</html>
