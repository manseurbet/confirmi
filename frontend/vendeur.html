<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – Création de commande</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}
.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.box{
  max-width:500px;
  width:100%;
  background:#0b1220;
  border-radius:16px;
  padding:32px 26px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
h1{
  font-size:28px;
  margin-bottom:12px;
}
h1 span{ color:#22c55e; }
p{
  font-size:15px;
  line-height:1.5;
  opacity:.9;
  margin-bottom:26px;
}
.form-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.form-row label{
  flex:0 0 35%;
  text-align:left;
  font-weight:bold;
}
.form-row input, .form-row select{
  flex:1;
  padding:10px;
  border-radius:6px;
  border:none;
  font-size:14px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  background:#22c55e;
  color:#022c22;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{ background:#16a34a; }
#sendZone{
  margin-top:20px;
  display:none;
  background:#122135;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  text-align:center;
}
#sendZone input{
  margin-bottom:10px;
  background:#0b1220;
  color:#fff;
}
/* LOGO HEADER */
.header-logo {
  text-align:center;
  margin-bottom:20px;
}
.header-logo img {
  width:200px;
  max-width:80%;
}
</style>
</head>
<body>

<div class="container">
  <div class="box">
  <!-- LOGO -->
    <div class="header-logo">
      <img src="logo.png" alt="Confirmi">
    </div>


    <p>WhatsApp أو SMS.أنشئ تأكيد الطلب مباشرة للزبون، وأرسل الرابط عبر </p>

    <form id="vendorForm">
      <div class="form-row">
        <label>👤 Nom du client</label>
        <input type="text" id="clientName" required>
      </div>

      <div class="form-row">
        <label>📞 Téléphone</label>
        <input type="tel" id="clientPhone" required>
      </div>

      <div class="form-row">
        <label>🔖 Réf. produit</label>
        <input type="text" id="productRef" required>
      </div>

      <div class="form-row">
        <label>📸 Photo produit</label>
        <input type="file" id="productPhoto" accept="image/*" required>
      </div>

      <div class="form-row">
        <label>💰 Montant</label>
        <input type="number" id="amount" required>
      </div>

      <div class="form-row">
        <label>📝 Description</label>
        <input type="text" id="description">
      </div>

      <button type="button" id="createBtn">Saisir La Commande </button>
    </form>

    <div id="sendZone">
      <p><strong>✅ Confirmation créée</strong></p>
      <label>Lien à envoyer au client
        <!-- Lien à envoyer au client -->
<div class="form-row" style="margin-top:15px; display:flex; align-items:center;">
  <label style="flex:0 0 40%; font-size:12px;">🔗 رابط للزبون</label>
  <input type="text" id="clientLink" readonly style="flex:1; font-size:12px; padding:6px;">
</div>

      <button type="button" onclick="copyLink()">🔗 Copier le lien</button>
      <button type="button" onclick="sendWhatsApp()">📲Ouvrir WhatsApp</button>
      <button type="button" onclick="sendSMS()">✉️Ouvrir SMS</button>
      <p style="font-size:12px; opacity:0.7;">L’envoi se fait depuis votre téléphone</p>
    </div>

  </div>
</div>

<script>
const createBtn = document.getElementById("createBtn");
const sendZone = document.getElementById("sendZone");
const clientLinkInput = document.getElementById("clientLink");
let confirmationLink = "";
let transactionCreated = false;

createBtn.addEventListener("click", async () => {
  if(transactionCreated){ alert("Commande déjà créée."); return; }

  const clientName = document.getElementById("clientName").value.trim();
  const clientPhone = document.getElementById("clientPhone").value.trim();
  const productRef = document.getElementById("productRef").value.trim();
  const amount = document.getElementById("amount").value.trim();
  const description = document.getElementById("description").value.trim();
  const productPhoto = document.getElementById("productPhoto").files[0];

  if(!clientName || !productRef || !amount || !productPhoto){ alert("Champs obligatoires manquants."); return; }
  if(!/^\d{10}$/.test(clientPhone)){ alert("Le numéro doit contenir 10 chiffres."); return; }

  const formData = new FormData();
  formData.append("clientName", clientName);
  formData.append("clientPhone", clientPhone);
  formData.append("productRef", productRef);
  formData.append("amount", amount);
  formData.append("description", description);
  formData.append("productPhoto", productPhoto);

  try{
    const res = await fetch("/create-confirmation", { method:"POST", body: formData });
    if(!res.ok){ const txt = await res.text(); alert("Erreur serveur : " + txt); return; }
    const data = await res.json();
    if(!data.success){ alert(data.message || "Erreur création."); return; }

    confirmationLink = data.clientLink;
    clientLinkInput.value = confirmationLink;
    sendZone.style.display = "block";
    transactionCreated = true;
  }catch(err){ console.error(err); alert("Erreur réseau."); }
});

function copyLink(){ navigator.clipboard.writeText(confirmationLink); alert("Lien copié."); }
function sendWhatsApp(){ window.open("https://wa.me/?text="+encodeURIComponent("Confirmez votre commande : "+confirmationLink), "_blank"); }
function sendSMS(){ window.location.href="sms:?body="+encodeURIComponent("Confirmez votre commande : "+confirmationLink); }
</script>

</body>
</html>
