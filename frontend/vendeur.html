<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – صفحة البائع</title>

<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;}
.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:500px;width:100%;background:#0b1220;border-radius:16px;padding:32px 26px;text-align:right;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
h1{text-align:center;}
h1 span{color:#22c55e;}
label{display:block;margin-top:12px;font-weight:bold;}
input,select{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
button{width:100%;margin-top:20px;padding:12px;background:#22c55e;color:#022c22;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
button:hover{background:#16a34a;}
.logo{display:block;margin:0 auto 15px;width:150px;}
#sendZone{display:none;margin-top:20px;text-align:center;}
.client-score{margin-bottom:10px;font-size:14px;}
</style>
</head>

<body>
<div class="container">
<div class="box">

<img src="logo.png" class="logo">
<h1>Confirmi <span>✓</span></h1>

<!-- SCORE CLIENT -->
<div class="client-score">
⭐ تقييم الزبون: <span id="clientScore">—</span>
</div>

<form id="vendorForm" enctype="multipart/form-data">

<label>اسم الزبون
<input type="text" id="clientName" required>
</label>

<label>رقم الهاتف
<input type="tel" id="clientPhone" required>
</label>

<div id="scoreClient"></div>

<label>رمز المنتج
<input type="text" id="productRef" required>
</label>

<label>صورة المنتج (إجبارية)
<input type="file" id="productPhoto" accept="image/*" required>
</label>

<label>السعر
<input type="number" id="amount" required>
</label>

<label>الوصف
<input type="text" id="description">
</label>

<button type="button" id="createBtn">إنشاء تأكيد الطلب</button>
</form>

<!-- ZONE LIEN -->
<div id="sendZone">
<p><strong>✅ تم إنشاء التأكيد</strong></p>

<label>رابط الزبون
<input type="text" id="clientLink" readonly>
</label>

<button onclick="copyLink()">نسخ الرابط</button>
<button onclick="sendWhatsApp()">WhatsApp</button>
<button onclick="sendSMS()">SMS</button>
</div>

</div>
</div>

<script>
const createBtn = document.getElementById("createBtn");
const sendZone = document.getElementById("sendZone");
const clientLinkInput = document.getElementById("clientLink");
const clientScoreSpan = document.getElementById("clientScore");
const scoreClientDiv = document.getElementById("scoreClient");

let confirmationLink = "";
let transactionCreated = false;

/* ===== SCORE CLIENT PAR TÉLÉPHONE ===== */
document.getElementById("clientPhone").addEventListener("blur", async ()=>{
  const phone = clientPhone.value.trim();
  if(!phone) return;

  try{
    const r = await fetch(`/score/client/${phone}`);
    const d = await r.json();
    clientScoreSpan.innerText = `${d.score} ⭐ (${d.badge})`;
  }catch(e){
    clientScoreSpan.innerText = "—";
  }
});

/* ===== CRÉATION COMMANDE ===== */
createBtn.addEventListener("click", async ()=>{
  if(transactionCreated) return alert("تم إنشاء الطلب مسبقًا");

  const formData = new FormData();
  formData.append("clientName", clientName.value.trim());
  formData.append("clientPhone", clientPhone.value.trim());
  formData.append("productRef", productRef.value.trim());
  formData.append("amount", amount.value.trim());
  formData.append("description", description.value.trim());
  formData.append("productPhoto", productPhoto.files[0]);

  try{
    const res = await fetch("/create-confirmation",{
      method:"POST",
      body:formData
    });
    const data = await res.json();

    if(!data.success) return alert(data.message);

    confirmationLink = data.clientLink;
    clientLinkInput.value = confirmationLink;
    sendZone.style.display = "block";
    transactionCreated = true;

  }catch(err){
    alert("خطأ فى إرسال الطلب");
  }
});

/* ===== ACTIONS ===== */
function copyLink(){
  navigator.clipboard.writeText(confirmationLink);
  alert("تم النسخ");
}
function sendWhatsApp(){
  window.open("https://wa.me/?text="+encodeURIComponent(confirmationLink));
}
function sendSMS(){
  window.location.href="sms:?body="+encodeURIComponent(confirmationLink);
}
</script>

</body>
</html>
