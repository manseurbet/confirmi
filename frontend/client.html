<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – تأكيد الطلب</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}
.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.box{
  max-width:500px;
  width:100%;
  background:#0b1220;
  border-radius:16px;
  padding:32px 26px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
h1{
  font-size:28px;
  margin-bottom:12px;
}
h1 span{ color:#22c55e; }
p{
  font-size:15px;
  line-height:1.5;
  opacity:.9;
  margin-bottom:26px;
}
.form-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.form-row label{
  flex:0 0 35%;
  text-align:left;
  font-weight:bold;
}
.form-row input, .form-row select{
  flex:1;
  padding:10px;
  border-radius:6px;
  border:none;
  font-size:14px;
  box-sizing:border-box;
  background:#122135;
  color:#fff;
}
.form-row input[readonly]{ background:#0b1220; color:#fff; }
#productImage{
  width:100%;
  border-radius:12px;
  margin-bottom:20px;
}
button{
  width:100%;
  padding:12px;
  background:#22c55e;
  color:#022c22;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{ background:#16a34a; }
</style>
</head>
<body>

<div class="container">
  <div class="box">

    <h1>Confirmi <span>✓</span></h1>
    <p>تأكد من المعلومات قبل الإرسال • </p>

    <img id="productImage" src="" alt="صورة المنتج">

    <form id="clientForm" enctype="multipart/form-data">
      <div class="form-row">
        <label>👤 اسم الزبون</label>
        <input type="text" id="clientName" readonly>
      </div>

      <div class="form-row">
        <label>📞 رقم الهاتف</label>
        <input type="text" id="clientPhone" readonly>
      </div>

      <div class="form-row">
        <label>🔖 رمز المنتج</label>
        <input type="text" id="productRef" readonly>
      </div>

      <div class="form-row">
        <label>💰 المبلغ</label>
        <input type="number" id="amount" readonly>
      </div>

      <div class="form-row">
        <label>📝 الوصف</label>
        <input type="text" id="description" readonly>
      </div>

      <div class="form-row">
        <label>💳 طريقة الدفع</label>
        <select id="paymentMethod" required>
          <option value="especes">عند الاستلام</option>
          <option value="virement">تحويل بنكي</option>
        </select>
      </div>

      <div class="form-row" id="attachmentRow" style="display:none;">
        <label>📎 إثبات الدفع</label>
        <input type="file" id="attachment" accept="image/*">
      </div>

      <button type="submit">تأكيد الطلب</button>
    </form>

  </div>
</div>

<script>
// --------- récupération transaction ----------
function getTransactionId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

async function loadTransaction(){
  const id = getTransactionId();
  if(!id){ alert("رقم المعاملة مفقود"); return; }

  try{
    const res = await fetch(`/transaction/${id}`);
    const data = await res.json();
    if(!data.success){ alert("المعاملة غير موجودة"); return; }

    const t = data.transaction;
    document.getElementById("clientName").value = t.clientName;
    document.getElementById("clientPhone").value = t.clientPhone;
    document.getElementById("productRef").value = t.productRef;
    document.getElementById("amount").value = t.amount;
    document.getElementById("description").value = t.description || "";
    document.getElementById("productImage").src = t.photo || "";
    document.getElementById("paymentMethod").value = t.paymentMethod || "especes";
  }catch(err){ console.error(err); alert("خطأ أثناء تحميل المعاملة"); }
}

loadTransaction();

// --------- toggle pièce jointe ----------
const paymentSelect = document.getElementById("paymentMethod");
const attachmentRow = document.getElementById("attachmentRow");

function toggleAttachment(){
  if(paymentSelect.value === "virement"){
    attachmentRow.style.display = "flex";
    document.getElementById("attachment").required = true;
  } else {
    attachmentRow.style.display = "none";
    document.getElementById("attachment").required = false;
  }
}

paymentSelect.addEventListener("change", toggleAttachment);
toggleAttachment();

// --------- envoi confirmation ----------
document.getElementById("clientForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const id = getTransactionId();
  if(!id){ alert("رقم المعاملة مفقود"); return; }

  const payment = paymentSelect.value;
  const file = document.getElementById("attachment").files[0];

  if(payment === "virement" && !file){
    alert("الرجاء إرفاق إثبات الدفع.");
    return;
  }

  const formData = new FormData();
  formData.append("paymentMethod", payment);
  if(file) formData.append("attachment", file);

  try{
    const res = await fetch(`/confirm-transaction/${id}`,{
      method:"POST",
      body:formData
    });
    const data = await res.json();
    if(data.success){
      alert("تم تأكيد العملية بنجاح 👍!");
      paymentSelect.disabled = true;
      document.getElementById("attachment").disabled = true;
    } else {
      alert("خطأ: " + data.message);
    }
  }catch(err){ console.error(err); alert("خطأ فى إرسال التأكيد!"); }
});
</script>

</body>
</html>
