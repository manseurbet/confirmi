<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – Confirme avant de livrer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: #fff;
  min-height: 100vh;
}
.layout {
  display: flex;
  min-height: 100vh;
}

/* ── COLONNE GAUCHE ── */
.left-panel {
  width: 280px;
  min-width: 280px;
  background: #0b1220;
  border-right: 1px solid #1e293b;
  display: flex;
  flex-direction: column;
  padding: 28px 20px;
  gap: 12px;
}
.logo-wrap {
  text-align: center;
  margin-bottom: 10px;
}
.logo-wrap img {
  width: 180px;
  max-width: 100%;
}
.slogan {
  text-align: center;
  font-size: 12px;
  color: #64748b;
  margin-bottom: 10px;
  line-height: 1.6;
}
.nav-btn {
  display: block;
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  text-align: left;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s;
}
.nav-btn:hover { opacity: 0.85; }
.nav-btn.green  { background: #22c55e; color: #022c22; }
.nav-btn.slate  { background: #334155; color: #fff; }
.nav-btn.indigo { background: #1e1b4b; color: #fff; }
.nav-btn.blue   { background: #1e3a5f; color: #38bdf8; border: 1px solid #38bdf8; }
.note-bottom {
  margin-top: auto;
  font-size: 11px;
  color: #475569;
  text-align: center;
  line-height: 1.7;
}

/* ── COLONNE DROITE ── */
.right-panel {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 20px;
  overflow-y: auto;
}
.form-box {
  width: 100%;
  max-width: 520px;
  background: #0b1220;
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  direction: rtl;
  text-align: right;
}
h1 { font-size: 22px; margin-bottom: 10px; text-align: center; }
h1 span { color: #22c55e; }
.score-card {
  background: #1e293b;
  padding: 8px;
  border-radius: 10px;
  margin-bottom: 10px;
  text-align: center;
  border: 1px solid #334155;
}
.score-label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
.score-value { font-size: 22px; font-weight: bold; color: #22c55e; }
form { display: flex; flex-direction: column; gap: 6px; }
label { font-weight: bold; font-size: 13px; }
input, textarea {
  width: 100%; padding: 8px;
  border-radius: 8px; border: 1px solid #334155;
  background: #0f172a; color: #fff; font-size: 13px;
}
button {
  width: 100%; padding: 13px;
  background: #22c55e; color: #022c22;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: bold;
  cursor: pointer; transition: 0.2s;
}
button:hover { opacity: 0.9; }
#resultSection {
  display: none; margin-top: 20px;
  padding: 18px; background: #122135;
  border-radius: 12px; border: 1px dashed #22c55e;
  text-align: center;
}
.btn-action {
  width: 100%; padding: 12px;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: bold;
  cursor: pointer; margin-top: 10px;
  display: flex; align-items: center;
  justify-content: center; gap: 8px;
}
.btn-contact  { background: #7c3aed; color: #fff; }
.btn-whatsapp { background: #25d366; color: #fff; }
.btn-sms      { background: #0ea5e9; color: #fff; }

/* Responsive mobile */
@media (max-width: 700px) {
  .layout { flex-direction: column; }
  .left-panel { width: 100%; min-width: 0; flex-direction: row; flex-wrap: wrap; padding: 16px; gap: 8px; border-right: none; border-bottom: 1px solid #1e293b; }
  .logo-wrap, .slogan, .note-bottom { width: 100%; }
  .nav-btn { width: auto; flex: 1; min-width: 120px; font-size: 13px; padding: 10px; }
}
</style>
</head>
<body>
<div class="layout">

  <!-- ── GAUCHE : Navigation ── -->
  <div class="left-panel">
    <div class="logo-wrap">
      <img src="logo.png" alt="Confirmi">
    </div>

    <a href="/transactions.html" class="nav-btn slate">🧾 قائمة المعاملات</a>
    <a href="/import.html"       class="nav-btn blue">📋 إرسال جماعي</a>
    <a href="/admin.html"        class="nav-btn indigo">📊 الاحصائيات</a>

  </div>

  <!-- ── DROITE : Formulaire Vendeur ── -->
  <div class="right-panel">
    <div class="form-box">
      <h1>Confirmi <span>✓</span></h1>

      <div class="score-card">
        <div class="score-label">⭐ تقييم موثوقية الزبون</div>
        <div><span class="score-value" id="scoreNum">--</span> <span id="badgeText"></span></div>
      </div>

      <form id="orderForm">
        <input type="hidden" id="sellerId">
        <label>رقم هاتف الزبون</label>
        <input type="tel" id="clientPhone" placeholder="0XXXXXXXXX" required>
        <label>اسم الزبون</label>
        <input type="text" id="clientName" required>
        <label>رمز المنتج / اسم المنتج</label>
        <input type="text" id="productRef" required>
        <label>السعر (دج)</label>
        <input type="number" id="amount" required>
        <label>الوصف</label>
        <textarea id="description" rows="2"></textarea>
        <label>صورة المنتج</label>
        <input type="file" id="productPhoto" accept="image/*">
        <button type="submit">إنشاء رابط التأكيد</button>
      </form>

      <div id="resultSection">
        <p style="color:#22c55e;font-weight:bold;font-size:17px;">✅ تم إنشاء الطلب بنجاح!</p>
        <p style="color:#94a3b8;font-size:13px;margin-top:4px;">اختر طريقة إرسال الرابط للزبون:</p>
        <button class="btn-action btn-contact" onclick="addContact()">👤 Ajouter aux contacts</button>
        <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">💬 إرسال عبر WhatsApp</button>
        <button class="btn-action btn-sms" onclick="sendSMS()">📱 إرسال عبر SMS</button>
        <button class="btn-action" onclick="resetForm()" style="background:#334155;color:#fff;margin-top:16px;">➕ طلب جديد</button>
      </div>
    </div>
  </div>

</div>
<script>
const sellerId = localStorage.getItem('sellerId') || 'seller_' + Math.random().toString(36).substr(2, 9);
localStorage.setItem('sellerId', sellerId);
document.getElementById('sellerId').value = sellerId;

let generatedLink = '';
let clientPhoneNumber = '';

const phoneInput = document.getElementById('clientPhone');
phoneInput.addEventListener('input', async () => {
  if (phoneInput.value.trim().length >= 10) {
    const res = await fetch(`/score/client/${phoneInput.value.trim()}`);
    const data = await res.json();
    document.getElementById('scoreNum').innerText = data.score + '%';
    document.getElementById('badgeText').innerText = data.badge;
  }
});

document.getElementById('orderForm').onsubmit = async (e) => {
  e.preventDefault();
  const formData = new FormData();
  formData.append('sellerId', sellerId);
  formData.append('clientName', document.getElementById('clientName').value);
  formData.append('clientPhone', phoneInput.value);
  formData.append('productRef', document.getElementById('productRef').value);
  formData.append('amount', document.getElementById('amount').value);
  formData.append('description', document.getElementById('description').value);
  const photo = document.getElementById('productPhoto').files[0];
  if (photo) formData.append('productPhoto', photo);

  const res = await fetch('/create-confirmation', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.success) {
    generatedLink = data.clientLink;
    clientPhoneNumber = phoneInput.value.trim().replace(/^0/, '213');
    document.getElementById('orderForm').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';
  }
};

function addContact() {
  const name = document.getElementById('clientName').value;
  const phone = phoneInput.value.trim();
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL;TYPE=CELL:${phone}\nEND:VCARD`;
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${name}.vcf`; a.click();
  URL.revokeObjectURL(url);
}

function sendWhatsApp() {
  const msg = encodeURIComponent('مرحبا، يرجى تأكيد طلبك عبر الرابط التالي:\n' + generatedLink);
  window.open(`https://wa.me/${clientPhoneNumber}?text=${msg}`, '_blank');
}

function sendSMS() {
  const msg = encodeURIComponent('تأكيد الطلب: ' + generatedLink);
  window.location.href = `sms:${clientPhoneNumber}?body=${msg}`;
}

function resetForm() {
  document.getElementById('orderForm').reset();
  document.getElementById('orderForm').style.display = 'flex';
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('scoreNum').innerText = '--';
  document.getElementById('badgeText').innerText = '';
  generatedLink = ''; clientPhoneNumber = '';
}
</script>
</body>
</html>
