<!DOCTYPE html>

<title>Confirmi – Confirme avant de livrer</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);

}
.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.box{

}
ul{

  padding:0;
  margin:0 0 28px;
}
ul li{
  margin:10px 0;
  font-size:14px;
}
.btn{
  display:block;
  background:#22c55e;
  color:#022c22;
  text-decoration:none;
  padding:14px;
  border-radius:10px;
  font-size:20px;
  font-weight:bold;
}
.btn:hover{ background:#16a34a; }
.note{

  font-size:12px;
  opacity:.6;
}
/* LOGO HEADER */
.header-logo {
  text-align:center;
  margin-bottom:20px;
}
.header-logo img {

  max-width:80%;

      <a href="/admin.html" class="btn" style="background: #1e1b4b; color: white;">📊   الاحصائيات</a>
    </div>

      بدون تطبيق • بدون تعقيد • يعمل فورًا
