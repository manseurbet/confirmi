<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmi – Confirme avant de livrer</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
}
.container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.box{
  max-width:420px;
  width:100%;
  background:#0b1220;
  border-radius:16px;
  padding:32px 26px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
h1{
  font-size:28px;
  margin-bottom:12px;
}
h1 span{ color:#22c55e; }
p{
  font-size:15px;
  line-height:1.5;
  opacity:.9;
  margin-bottom:26px;
}
ul{
  list-style:none;
  padding:0;
  margin:0 0 28px;
}
ul li{
  margin:10px 0;
  font-size:14px;
}
.btn{
  display:block;
  background:#22c55e;
  color:#022c22;
  text-decoration:none;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}
.btn:hover{ background:#16a34a; }
.note{
  margin-top:14px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>
<div class="container">
  <div class="box">

    <h1>Confirmi <span>✓</span></h1>

    <p>
      تأكد من الطلب قبل الإرسال.<br>
      لا شحن… لا إرجاع… لا خسائر.
    </p>

    <ul>
      <li>📸 صورة المنتج + السعر</li>
      <li>📲 تأكيد مباشر من الزبون</li>
      <li>💬 عبر WhatsApp أو SMS</li>
    </ul>

    <a href="/vendeur.html" class="btn">ابدأ الآن</a>

    <div class="note">
      بدون تطبيق • بدون تعقيد • يعمل فورًا
    </div>

  </div>
</div>
</body>
</html>
